<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Monroe Tech</title>
    <script>
      // SPA fallback for GitHub Pages (custom domain at root → pathSegmentsToKeep = 0).
      // Encodes the requested path into the query string and redirects to index.html,
      // where a matching decoder in index.html restores the real URL for react-router.
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
